<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Department Store Billing</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: var(--border-radius-lg);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }
    .login-header {
      background: #0f172a;
      color: white;
      padding: 32px 28px;
      text-align: center;
    }
    .login-logo {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 12px;
    }
    .login-header h2 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .login-header p {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    .login-body {
      padding: 32px 28px;
    }
    .credentials-hint {
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border: 1px dashed var(--border-color);
      border-radius: var(--border-radius-sm);
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">&#128722;</div>
      <h2>DEPARTMENT STORE</h2>
      <p>Billing & Customer Account System</p>
    </div>

    <div class="login-body">
      <!-- Flash Alert -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
              <span>{{ message }}</span>
              <button type="button" class="alert-close" onclick="this.parentElement.remove();">&times;</button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;">
          Sign In to Dashboard &rarr;
        </button>
      </form>

      <div class="credentials-hint">
        <strong>Default Admin Login:</strong><br>
        Username: <code>admin</code> &bull; Password: <code>admin123</code>
      </div>
    </div>
  </div>
</body>
</html>
